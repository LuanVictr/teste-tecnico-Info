<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aivacol — Plataforma de Gestão de Frota</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
:root{
  --y:#F5BB00;--yd:#C99600;--ym:rgba(245,187,0,.12);--yl:#FFFBEB;
  --og:#E8701E;--ogm:rgba(232,112,30,.12);
  --sb:#111114;--sb2:#1A1A1E;--sb3:#232328;
  --bg:#F4F4F6;--wh:#FFFFFF;
  --tx:#111114;--t2:#6B7280;--t3:#9CA3AF;
  --bd:#E5E7EB;--bd2:#F3F4F6;
  --ok:#16A34A;--okb:#DCFCE7;
  --wn:#CA8A04;--wnb:#FEF9C3;
  --er:#DC2626;--erb:#FEE2E2;
  --r:10px;--sh:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shm:0 4px 16px rgba(0,0,0,.12);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body,#root{height:100%;}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--tx);background:var(--bg);}
button{font-family:inherit;cursor:pointer;border:0;outline:0;transition:all .15s;}
input,select,textarea{font-family:inherit;outline:0;}
svg{display:block;flex-shrink:0;}

/* ── LOGIN ────────────────────────────────────────────── */
.login-wrap{height:100%;display:flex;align-items:stretch;}
.login-left{flex:1;background:var(--sb);display:flex;flex-direction:column;justify-content:space-between;padding:48px;position:relative;overflow:hidden;}
.login-left::before{content:'';position:absolute;width:480px;height:480px;border-radius:50%;background:rgba(245,187,0,.06);top:-120px;left:-120px;}
.login-left::after{content:'';position:absolute;width:320px;height:320px;border-radius:50%;background:rgba(245,187,0,.04);bottom:-80px;right:-80px;}
.ll-logo{display:flex;align-items:center;gap:12px;z-index:1;}
.ll-badge{width:40px;height:40px;border-radius:10px;background:var(--y);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:var(--sb);}
.ll-brand{font-weight:800;font-size:22px;color:#fff;letter-spacing:-.3px;}
.ll-brand span{color:var(--y);}
.ll-hero{z-index:1;}
.ll-hero h1{font-size:36px;font-weight:800;color:#fff;line-height:1.2;letter-spacing:-.5px;margin-bottom:16px;}
.ll-hero h1 em{font-style:normal;color:var(--y);}
.ll-hero p{color:var(--t3);font-size:15px;line-height:1.6;max-width:340px;}
.ll-chips{display:flex;flex-wrap:wrap;gap:8px;z-index:1;}
.ll-chip{padding:6px 12px;border-radius:20px;background:var(--sb3);border:1px solid var(--sb3);color:var(--t3);font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;}
.ll-chip span{width:6px;height:6px;border-radius:50%;background:var(--ok);}
.login-right{width:460px;display:flex;align-items:center;justify-content:center;padding:48px;}
.login-card{width:100%;}
.login-card h2{font-size:24px;font-weight:800;margin-bottom:6px;letter-spacing:-.3px;}
.login-card p{color:var(--t2);font-size:14px;margin-bottom:32px;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--t2);margin-bottom:6px;}
.form-group input{width:100%;padding:11px 14px;border:1.5px solid var(--bd);border-radius:8px;font-size:14px;color:var(--tx);background:var(--wh);transition:border-color .15s;}
.form-group input:focus{border-color:var(--y);}
.btn-primary{width:100%;padding:12px;border-radius:8px;background:var(--y);color:var(--sb);font-weight:700;font-size:14px;letter-spacing:.1px;}
.btn-primary:hover{background:var(--yd);}
.login-hint{margin-top:20px;padding:12px 14px;background:var(--bd2);border-radius:8px;font-size:12.5px;color:var(--t2);}
.login-hint strong{color:var(--tx);}
.login-error{color:var(--er);font-size:13px;margin-top:8px;display:flex;align-items:center;gap:6px;}

/* ── APP LAYOUT ────────────────────────────────────────── */
.app{display:flex;height:100%;overflow:hidden;}
.sidebar{width:220px;flex-shrink:0;background:var(--sb);display:flex;flex-direction:column;height:100%;overflow-y:auto;}
.sb-logo{padding:20px 16px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.06);}
.sb-badge{width:34px;height:34px;border-radius:8px;background:var(--y);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:var(--sb);}
.sb-name{font-weight:800;font-size:15px;color:#fff;letter-spacing:-.2px;}
.sb-name small{display:block;font-size:10px;font-weight:500;color:var(--t3);letter-spacing:.3px;text-transform:uppercase;}
.sb-nav{flex:1;padding:12px 8px;}
.sb-section{font-size:10px;font-weight:700;color:var(--t3);letter-spacing:.8px;text-transform:uppercase;padding:8px 10px 4px;}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--t3);font-size:13.5px;font-weight:500;transition:all .15s;margin-bottom:1px;position:relative;}
.sb-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.sb-item.active{background:var(--ym);color:var(--y);font-weight:600;}
.sb-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--y);border-radius:0 3px 3px 0;}
.sb-foot{padding:12px 8px;border-top:1px solid rgba(255,255,255,.06);}
.sb-user{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;}
.sb-avatar{width:30px;height:30px;border-radius:50%;background:var(--ym);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:var(--y);}
.sb-uname{font-size:13px;font-weight:600;color:#fff;}
.sb-urole{font-size:11px;color:var(--t3);}
.sb-logout{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;color:var(--t3);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;margin-top:4px;}
.sb-logout:hover{background:rgba(255,255,255,.06);color:var(--er);}

/* ── MAIN ──────────────────────────────────────────────── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{height:58px;background:var(--wh);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0;}
.tb-title{font-size:17px;font-weight:700;letter-spacing:-.2px;}
.tb-right{display:flex;align-items:center;gap:12px;}
.tb-tag{padding:4px 10px;border-radius:20px;background:var(--ym);color:var(--yd);font-size:11.5px;font-weight:700;letter-spacing:.2px;}
.tb-bell{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--bd);background:transparent;display:flex;align-items:center;justify-content:center;color:var(--t2);}
.tb-bell:hover{background:var(--bd2);}
.content{flex:1;overflow-y:auto;padding:24px;}

/* ── DASHBOARD ─────────────────────────────────────────── */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
.kpi-card{background:var(--wh);border-radius:var(--r);padding:20px;box-shadow:var(--sh);}
.kpi-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;}
.kpi-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
.kpi-icon.y{background:var(--ym);color:var(--yd);}
.kpi-icon.og{background:var(--ogm);color:var(--og);}
.kpi-icon.ok{background:var(--okb);color:var(--ok);}
.kpi-icon.bd{background:var(--bd2);color:var(--t2);}
.kpi-delta{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;}
.kpi-delta.up{background:var(--okb);color:var(--ok);}
.kpi-num{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1;}
.kpi-label{font-size:12.5px;color:var(--t2);margin-top:4px;font-weight:500;}

.dash-grid{display:grid;grid-template-columns:1fr 340px;gap:16px;}
.card{background:var(--wh);border-radius:var(--r);padding:20px;box-shadow:var(--sh);}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.card-hd h3{font-size:14px;font-weight:700;}
.card-hd a{font-size:12.5px;color:var(--y);font-weight:600;cursor:pointer;}
.card-hd a:hover{color:var(--yd);}

.act-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd2);}
.act-item:last-child{border-bottom:0;padding-bottom:0;}
.act-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.act-info{flex:1;}
.act-info strong{font-size:13px;font-weight:600;display:block;}
.act-info span{font-size:12px;color:var(--t2);}
.act-time{font-size:11.5px;color:var(--t3);}

.sys-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd2);}
.sys-item:last-child{border-bottom:0;padding-bottom:0;}
.sys-left{display:flex;align-items:center;gap:10px;}
.sys-ico{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;}
.sys-label{font-size:13px;font-weight:600;}
.sys-sub{font-size:11.5px;color:var(--t3);}
.sys-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);}
.sys-badge{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.sys-badge.ok{background:var(--okb);color:var(--ok);}
.sys-badge.wn{background:var(--wnb);color:var(--wn);}

/* ── TABLE PAGE ─────────────────────────────────────────── */
.page-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.page-hd h2{font-size:20px;font-weight:800;letter-spacing:-.3px;}
.btn-add{display:flex;align-items:center;gap:7px;padding:9px 16px;border-radius:8px;background:var(--y);color:var(--sb);font-weight:700;font-size:13.5px;}
.btn-add:hover{background:var(--yd);}
.filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.search-wrap{position:relative;flex:1;min-width:180px;max-width:300px;}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--t3);}
.search-wrap input{width:100%;padding:9px 12px 9px 36px;border:1.5px solid var(--bd);border-radius:8px;font-size:13.5px;background:var(--wh);color:var(--tx);}
.search-wrap input:focus{border-color:var(--y);}
.filter-sel{padding:9px 12px;border:1.5px solid var(--bd);border-radius:8px;font-size:13.5px;background:var(--wh);color:var(--tx);cursor:pointer;}
.filter-sel:focus{border-color:var(--y);}
.tbl-wrap{background:var(--wh);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;}
.tbl-wrap table{width:100%;border-collapse:collapse;}
.tbl-wrap thead tr{background:var(--bd2);}
.tbl-wrap th{padding:10px 14px;text-align:left;font-size:11.5px;font-weight:700;color:var(--t2);letter-spacing:.4px;text-transform:uppercase;white-space:nowrap;cursor:pointer;user-select:none;}
.tbl-wrap th:hover{color:var(--tx);}
.tbl-wrap td{padding:12px 14px;font-size:13.5px;border-bottom:1px solid var(--bd2);vertical-align:middle;}
.tbl-wrap tr:last-child td{border-bottom:0;}
.tbl-wrap tbody tr:hover{background:var(--yl);}
.mono{font-family:'SFMono-Regular',Consolas,monospace;font-size:12.5px;}
.tbl-actions{display:flex;gap:6px;}
.btn-icon{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .15s;}
.btn-edit{background:var(--ogm);color:var(--og);}
.btn-edit:hover{background:var(--og);color:#fff;}
.btn-del{background:var(--erb);color:var(--er);}
.btn-del:hover{background:var(--er);color:#fff;}
.pager{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-top:1px solid var(--bd2);}
.pager span{font-size:13px;color:var(--t2);}
.pager-btns{display:flex;gap:6px;}
.pager-btns button{padding:6px 14px;border-radius:6px;border:1.5px solid var(--bd);background:var(--wh);font-size:13px;font-weight:600;color:var(--tx);}
.pager-btns button:hover:not(:disabled){background:var(--bd2);}
.pager-btns button:disabled{opacity:.4;cursor:default;}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;}
.badge.active{background:var(--okb);color:var(--ok);}
.badge.maintenance{background:var(--wnb);color:var(--wn);}
.badge.inactive{background:var(--bd2);color:var(--t2);}
.empty-row td{text-align:center;padding:40px;color:var(--t3);font-size:14px;}

/* ── MODAL ─────────────────────────────────────────────── */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(4px);}
.modal-box{background:var(--wh);border-radius:14px;width:100%;max-width:480px;box-shadow:var(--shm);animation:mIn .18s ease;}
@keyframes mIn{from{transform:translateY(10px) scale(.98);opacity:0;}to{transform:none;opacity:1;}}
.modal-hd{padding:20px 24px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;}
.modal-hd h3{font-size:16px;font-weight:700;}
.modal-close{width:30px;height:30px;border-radius:7px;background:var(--bd2);display:flex;align-items:center;justify-content:center;color:var(--t2);}
.modal-close:hover{background:var(--bd);color:var(--tx);}
.modal-body{padding:20px 24px;}
.modal-ft{padding:16px 24px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:10px;}
.m-fg{margin-bottom:14px;}
.m-fg label{display:block;font-size:12.5px;font-weight:600;color:var(--t2);margin-bottom:5px;}
.m-fg input,.m-fg select{width:100%;padding:9px 12px;border:1.5px solid var(--bd);border-radius:8px;font-size:14px;color:var(--tx);background:var(--wh);}
.m-fg input:focus,.m-fg select:focus{border-color:var(--y);}
.m-fg .err{font-size:12px;color:var(--er);margin-top:4px;}
.m-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.btn-cancel{padding:9px 18px;border-radius:8px;border:1.5px solid var(--bd);background:transparent;font-size:14px;font-weight:600;color:var(--tx);}
.btn-cancel:hover{background:var(--bd2);}
.btn-save{padding:9px 22px;border-radius:8px;background:var(--y);color:var(--sb);font-size:14px;font-weight:700;}
.btn-save:hover{background:var(--yd);}

/* ── TOAST ─────────────────────────────────────────────── */
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:10px;box-shadow:var(--shm);animation:tIn .2s ease;font-size:14px;font-weight:600;min-width:240px;max-width:320px;}
@keyframes tIn{from{transform:translateX(20px);opacity:0;}to{transform:none;opacity:1;}}
.toast.ok{background:#ECFDF5;border:1.5px solid #A7F3D0;color:#065F46;}
.toast.er{background:#FEF2F2;border:1.5px solid #FECACA;color:#991B1B;}
.toast.info{background:#EFF6FF;border:1.5px solid #BFDBFE;color:#1E40AF;}

/* ── MISC ──────────────────────────────────────────────── */
.breadcrumb{font-size:12.5px;color:var(--t3);font-weight:500;display:flex;align-items:center;gap:6px;}
.breadcrumb b{color:var(--tx);}
.tag-nest{padding:3px 8px;border-radius:6px;background:var(--sb);color:var(--y);font-size:11px;font-weight:700;font-family:'SFMono-Regular',monospace;}
.delete-confirm{padding:16px;background:var(--erb);border-radius:8px;margin-bottom:4px;}
.delete-confirm p{font-size:13.5px;color:var(--er);font-weight:500;}
.delete-confirm strong{font-weight:700;}
.jwt-bar{background:var(--sb2);border-radius:8px;padding:12px 14px;margin-bottom:16px;display:flex;align-items:center;gap:10px;}
.jwt-bar span{font-family:'SFMono-Regular',monospace;font-size:11px;color:var(--t3);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.jwt-bar strong{font-size:11px;color:var(--y);font-weight:700;flex-shrink:0;}
.chart-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.chart-bar-label{font-size:12px;color:var(--t2);width:80px;text-align:right;flex-shrink:0;}
.chart-bar-track{flex:1;height:8px;background:var(--bd2);border-radius:4px;overflow:hidden;}
.chart-bar-fill{height:100%;border-radius:4px;background:var(--y);transition:width .8s ease;}
.chart-bar-val{font-size:12px;font-weight:700;color:var(--tx);width:30px;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

function Login({onLogin}){
  const [email,setEmail]=useState('');

  const submit = e => {
    e.preventDefault();

    setLoading(true);
    setTimeout(()=>{
      if(email==='aivacol'||email.includes('aivacol')){
        onLogin('aivacol');
      } else {
        setErr('Credenciais inválidas. Use o usuário padrão.');
        setLoading(false);
      }
    },900);
  };
  return <div className="login-wrap">
    <div className="login-left">

        <div className="ll-brand">Aivacol</div>

      <div className="ll-chips">
        <div className="ll-chip"><span></span>NestJS 10+</div>
        <div className="ll-chip"><span></span>JWT Auth</div>
        <div className="ll-chip"><span></span>Redis Cache</div>
        <div className="ll-chip"><span></span>SQL Server</div>
        <div className="ll-chip"><span></span>TypeORM</div>
        <div className="ll-chip"><span></span>Jest Tests</div>
      </div>
    </div>
    <div className="login-right">
      <div className="login-card">
        <h2>Entrar na plataforma</h2>
        <p>Use as credenciais do seed para acessar.</p>
        <form onSubmit={submit}>
          <div className="form-group">
            <label>Usuário / E-mail</label>
            <input value={email} onChange={e=>setEmail(e.target.value)} placeholder="aivacol" autoFocus/>

/* ── ANIMATED COUNTER ───────────────────────────── */
function Counter({to}){
  const [v,setV]=useState(0);
  useEffect(()=>{
    let start=0; const step=Math.ceil(to/40);
    const t=setInterval(()=>{start+=step;if(start>=to){setV(to);clearInterval(t);}else setV(start);},20);
    return()=>clearInterval(t);
  },[to]);
  return <>{v.toLocaleString('pt-BR')}</>;
}

/* ── BAR CHART ──────────────────────────────────── */
function BarChart({data}){
  const max=Math.max(...data.map(d=>d.v));
  return <div>{data.map(d=>(
    <div key={d.label} className="chart-bar-row">
      <div className="chart-bar-label">{d.label}</div>
      <div className="chart-bar-track"><div className="chart-bar-fill" style={{width:`${(d.v/max)*100}%`,background:d.color||'var(--y)'}}/></div>
      <div className="chart-bar-val">{d.v}</div>
    </div>
  ))}</div>;
}

/* ── VEHICLES PAGE ───────────────────────────────── */
function VehiclesPage({vehicles,setVehicles,models,brands,toast}){
  const [search,setSearch]=useState('');
  const [statusF,setStatusF]=useState('');
  const [page,setPage]=useState(1);
  const [modal,setModal]=useState(null); // null | {type:'add'|'edit'|'del', data?}
  const [form,setForm]=useState({});
  const PER=10;
  const filtered=vehicles.filter(v=>{
    const m=models.find(x=>x.id===v.model_id);
    const q=search.toLowerCase();
    return(!q||(v.license_plate.toLowerCase().includes(q)||m?.name.toLowerCase().includes(q)))&&(!statusF||v.status===statusF);
  });
  const pages=Math.ceil(filtered.length/PER)||1;
  const rows=filtered.slice((page-1)*PER,page*PER);
  const openAdd=()=>{setForm({license_plate:'',chassis:'',renavam:'',year:new Date().getFullYear(),model_id:models[0]?.id||'',status:'active'});setModal({type:'add'});};
  const openEdit=v=>{setForm({...v});setModal({type:'edit',data:v});};
  const openDel=v=>setModal({type:'del',data:v});
  const [errs,setErrs]=useState({});
  const validate=()=>{
    const e={};
    if(!form.license_plate) e.license_plate='Campo obrigatório';
    if(!form.chassis||form.chassis.length!==17) e.chassis='Chassi deve ter 17 caracteres';
    if(!form.renavam||form.renavam.length!==11) e.renavam='RENAVAM deve ter 11 dígitos';
    if(!form.year||form.year<2000||form.year>2030) e.year='Ano inválido';
    if(!form.model_id) e.model_id='Selecione um modelo';
    setErrs(e); return !Object.keys(e).length;
  };
  const save=()=>{
    if(!validate()) return;
    if(modal.type==='add'){
      setVehicles(p=>[...p,{...form,id:genId(p),created_at:new Date().toISOString().slice(0,10),created_by:'aivacol'}]);
      toast('Veículo adicionado com sucesso!','ok');
    } else {
      setVehicles(p=>p.map(v=>v.id===form.id?{...form}:v));
      toast('Veículo atualizado.','ok');
    }
    setModal(null);
  };
  const del=()=>{
    setVehicles(p=>p.filter(v=>v.id!==modal.data.id));
    toast('Veículo removido.','info'); setModal(null);
  };
  const fld=(key,label,props={})=>(
    <div className="m-fg">
      <label>{label}</label>
      <input value={form[key]||''} onChange={e=>{setForm(p=>({...p,[key]:e.target.value}));setErrs(p=>({...p,[key]:''}));}} {...props}/>
      {errs[key]&&<div className="err">{errs[key]}</div>}
    </div>
  );
  return <div>
    <div className="page-hd">
      <div>
        <h2>Veículos</h2>
        <div className="breadcrumb" style={{marginTop:2}}>seed_vehicles.json · {vehicles.length} registros</div>
      </div>
      <button className="btn-add" onClick={openAdd}><Ico n="plus" s={14}/>Novo Veículo</button>
    </div>
    <div className="filters">
      <div className="search-wrap"><Ico n="search" s={14}/><input placeholder="Buscar por placa ou modelo…" value={search} onChange={e=>{setSearch(e.target.value);setPage(1);}}/></div>
      <select className="filter-sel" value={statusF} onChange={e=>{setStatusF(e.target.value);setPage(1);}}>
        <option value="">Todos os status</option>
        <option value="active">Ativo</option>
        <option value="maintenance">Manutenção</option>
        <option value="inactive">Inativo</option>
      </select>
    </div>
    <div className="tbl-wrap">
      <table>
        <thead><tr>
          <th>#</th><th>Placa</th><th>Chassi</th><th>RENAVAM</th><th>Ano</th><th>Modelo</th><th>Marca</th><th>Status</th><th>Criado</th><th></th>
        </tr></thead>
        <tbody>
          {rows.length===0?<tr className="empty-row"><td colSpan={10}>Nenhum veículo encontrado.</td></tr>:
          rows.map(v=>{
            const m=models.find(x=>x.id===Number(v.model_id));
            const b=brands.find(x=>x.id===m?.brand_id);
            return <tr key={v.id}>
              <td style={{color:'var(--t3)',fontSize:12}}>{v.id}</td>
              <td><span className="mono">{v.license_plate}</span></td>
              <td><span className="mono">{v.chassis}</span></td>
              <td><span className="mono">{v.renavam}</span></td>
              <td>{v.year}</td>
              <td>{m?.name||'—'}</td>
              <td>{b?.name||'—'}</td>
              <td><Badge s={v.status}/></td>
              <td style={{color:'var(--t3)',fontSize:12}}>{fmtDate(v.created_at)}</td>
              <td><div className="tbl-actions">
                <button className="btn-icon btn-edit" onClick={()=>openEdit(v)}><Ico n="pencil" s={13}/></button>
                <button className="btn-icon btn-del" onClick={()=>openDel(v)}><Ico n="trash" s={13}/></button>
              </div></td>
            </tr>;
          })}

      </table>

        <span>Mostrando {Math.min((page-1)*PER+1,filtered.length)}–{Math.min(page*PER,filtered.length)} de {filtered.length}</span>

          <button onClick={()=>setPage(p=>p-1)} disabled={page===1}>← Anterior</button>
          <button onClick={()=>setPage(p=>p+1)} disabled={page===pages}>Próximo →</button>
        </div>
      </div>
    </div>
    <Modal open={modal?.type==='add'||modal?.type==='edit'} title={modal?.type==='add'?'Novo Veículo':'Editar Veículo'} onClose={()=>setModal(null)} onSave={save}>

      {fld('chassis','Chassi * (17 caracteres)',{placeholder:'9BWZZZ377VT004251',maxLength:17})}
      {fld('renavam','RENAVAM * (11 dígitos)',{placeholder:'12345678901',maxLength:11})}
      <div className="m-row">
        <div className="m-fg">
          <label>Modelo *</label>
          <select value={form.model_id||''} onChange={e=>{setForm(p=>({...p,model_id:Number(e.target.value)}));setErrs(p=>({...p,model_id:''}));}}>
            <option value="">Selecionar…</option>
            {models.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}
          </select>
          {errs.model_id&&<div className="err">{errs.model_id}</div>}
        </div>
        <div className="m-fg">
          <label>Status</label>
          <select value={form.status||'active'} onChange={e=>setForm(p=>({...p,status:e.target.value}))}>
            <option value="active">Ativo</option>
            <option value="maintenance">Manutenção</option>
            <option value="inactive">Inativo</option>
          </select>
        </div>
      </div>
    </Modal>
    <Modal open={modal?.type==='del'} title="Remover Veículo" onClose={()=>setModal(null)} onSave={del} saveLabel="Remover">
      <div className="delete-confirm"><p>Tem certeza que deseja remover o veículo <strong>{modal?.data?.license_plate}</strong>? Esta ação não pode ser desfeita.</p></div>
    </Modal>
  </div>;
}

/* ── MODELS PAGE ─────────────────────────────────── */
function ModelsPage({models,setModels,brands,toast}){
  const [search,setSearch]=useState('');
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({name:'',brand_id:''});
  const [errs,setErrs]=useState({});
  const filtered=models.filter(m=>!search||m.name.toLowerCase().includes(search.toLowerCase()));
  const save=()=>{
    const e={};
    if(!form.name) e.name='Nome obrigatório';
    if(!form.brand_id) e.brand_id='Marca obrigatória';
    setErrs(e); if(Object.keys(e).length) return;
    if(modal.type==='add'){
      setModels(p=>[...p,{...form,brand_id:Number(form.brand_id),id:genId(p),created_at:new Date().toISOString().slice(0,10),created_by:'aivacol'}]);
      toast('Modelo adicionado!','ok');
    } else {
      setModels(p=>p.map(m=>m.id===form.id?{...form,brand_id:Number(form.brand_id)}:m));
      toast('Modelo atualizado.','ok');
    }
    setModal(null);
  };
  const del=()=>{setModels(p=>p.filter(m=>m.id!==modal.data.id));toast('Modelo removido.','info');setModal(null);};
  return <div>
    <div className="page-hd">
      <h2>Modelos <span style={{fontSize:14,fontWeight:500,color:'var(--t2)'}}>— CRUD obrigatório</span></h2>
      <button className="btn-add" onClick={()=>{setForm({name:'',brand_id:brands[0]?.id||''});setErrs({});setModal({type:'add'})}}><Ico n="plus" s={14}/>Novo Modelo</button>
    </div>
    <div className="filters">
      <div className="search-wrap"><Ico n="search" s={14}/><input placeholder="Buscar modelo…" value={search} onChange={e=>setSearch(e.target.value)}/></div>
    </div>
    <div className="tbl-wrap">
      <table>
        <thead><tr><th>#</th><th>Nome</th><th>Marca</th><th>Criado em</th><th>Criado por</th><th></th></tr></thead>
        <tbody>{filtered.length===0?<tr className="empty-row"><td colSpan={6}>Nenhum modelo.</td></tr>:
          filtered.map(m=>{
            const b=brands.find(x=>x.id===m.brand_id);
            return <tr key={m.id}>
              <td style={{color:'var(--t3)',fontSize:12}}>{m.id}</td>
              <td style={{fontWeight:600}}>{m.name}</td>
              <td>{b?.name||'—'}</td>
              <td style={{color:'var(--t3)',fontSize:12}}>{fmtDate(m.created_at)}</td>
              <td><span className="mono" style={{fontSize:12}}>{m.created_by}</span></td>
              <td><div className="tbl-actions">
                <button className="btn-icon btn-edit" onClick={()=>{setForm({...m});setErrs({});setModal({type:'edit',data:m});}}><Ico n="pencil" s={13}/></button>
                <button className="btn-icon btn-del" onClick={()=>setModal({type:'del',data:m})}><Ico n="trash" s={13}/></button>
              </div></td>
            </tr>;
          })}
        </tbody>
      </table>
    </div>
    <Modal open={modal?.type==='add'||modal?.type==='edit'} title={modal?.type==='add'?'Novo Modelo':'Editar Modelo'} onClose={()=>setModal(null)} onSave={save}>
      <div className="m-fg"><label>Nome *</label><input value={form.name} onChange={e=>{setForm(p=>({...p,name:e.target.value}));setErrs(p=>({...p,name:''}))}}/>{errs.name&&<div className="err">{errs.name}</div>}</div>
      <div className="m-fg"><label>Marca *</label>
        <select value={form.brand_id} onChange={e=>{setForm(p=>({...p,brand_id:e.target.value}));setErrs(p=>({...p,brand_id:''}))}}>
          <option value="">Selecionar…</option>
          {brands.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}
        </select>{errs.brand_id&&<div className="err">{errs.brand_id}</div>}
      </div>
    </Modal>
    <Modal open={modal?.type==='del'} title="Remover Modelo" onClose={()=>setModal(null)} onSave={del} saveLabel="Remover">
      <div className="delete-confirm"><p>Remover o modelo <strong>{modal?.data?.name}</strong>?</p></div>
    </Modal>
  </div>;
}

/* ── BRANDS PAGE ─────────────────────────────────── */
function BrandsPage({brands,setBrands,models,toast}){
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({name:''});
  const [err,setErr]=useState('');
  const save=()=>{
    if(!form.name){setErr('Nome obrigatório');return;}
    if(modal.type==='add'){
      setBrands(p=>[...p,{...form,id:genId(p),created_at:new Date().toISOString().slice(0,10),created_by:'aivacol'}]);
      toast('Marca adicionada! (bônus)','ok');
    } else {
      setBrands(p=>p.map(b=>b.id===form.id?{...form}:b));
      toast('Marca atualizada.','ok');
    }
    setModal(null);
  };
  const del=()=>{setBrands(p=>p.filter(b=>b.id!==modal.data.id));toast('Marca removida.','info');setModal(null);};
  return <div>
    <div className="page-hd">
      <h2>Marcas <span style={{fontSize:14,fontWeight:500,color:'var(--og)'}}>— bônus ✦</span></h2>
      <button className="btn-add" onClick={()=>{setForm({name:''});setErr('');setModal({type:'add'})}}><Ico n="plus" s={14}/>Nova Marca</button>
    </div>
    <div className="tbl-wrap">
      <table>
        <thead><tr><th>#</th><th>Nome</th><th>Modelos</th><th>Criado em</th><th>Criado por</th><th></th></tr></thead>
        <tbody>{brands.map(b=>(
          <tr key={b.id}>
            <td style={{color:'var(--t3)',fontSize:12}}>{b.id}</td>
            <td style={{fontWeight:600}}>{b.name}</td>
            <td><span className="badge inactive">{models.filter(m=>m.brand_id===b.id).length}</span></td>
            <td style={{color:'var(--t3)',fontSize:12}}>{fmtDate(b.created_at)}</td>
            <td><span className="mono" style={{fontSize:12}}>{b.created_by}</span></td>
            <td><div className="tbl-actions">
              <button className="btn-icon btn-edit" onClick={()=>{setForm({...b});setErr('');setModal({type:'edit',data:b});}}><Ico n="pencil" s={13}/></button>
              <button className="btn-icon btn-del" onClick={()=>setModal({type:'del',data:b})}><Ico n="trash" s={13}/></button>
            </div></td>
          </tr>
        ))}</tbody>
      </table>
    </div>
    <Modal open={modal?.type==='add'||modal?.type==='edit'} title={modal?.type==='add'?'Nova Marca':'Editar Marca'} onClose={()=>setModal(null)} onSave={save}>
      <div className="m-fg"><label>Nome *</label><input value={form.name} onChange={e=>{setForm(p=>({...p,name:e.target.value}));setErr('');}}/>{err&&<div className="err">{err}</div>}</div>
    </Modal>
    <Modal open={modal?.type==='del'} title="Remover Marca" onClose={()=>setModal(null)} onSave={del} saveLabel="Remover">
      <div className="delete-confirm"><p>Remover a marca <strong>{modal?.data?.name}</strong>?</p></div>
    </Modal>
  </div>;
}

  {method:'DELETE',path:'/brands/:id',desc:'Remover marca (bônus)',tag:'brands'},
];
const METHOD_C = {GET:'#1D6FA4',POST:'#1A7A4A',PUT:'#C17824',DELETE:'#C0392B'};

  return <div>
    <div className="page-hd" style={{marginBottom:16}}>

      <table>

/* ── APP ─────────────────────────────────────────── */
function App(){
  const [logged,setLogged]=useState(()=>!!localStorage.getItem('aivacol_user'));
  const [page,setPage]=useState(()=>localStorage.getItem('aivacol_page')||'dashboard');
  const [vehicles,setVehicles]=useState(VEHICLES_INIT);
  const [models,setModels]=useState(MODELS_INIT);
  const [brands,setBrands]=useState(BRANDS_INIT);
  const [toasts,setToasts]=useState([]);
  useEffect(()=>{ localStorage.setItem('aivacol_page',page); },[page]);
  const toast=(msg,type='info')=>{
    const id=Date.now();
    setToasts(p=>[...p,{id,msg,type}]);
    setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),3000);
  };
  const login=user=>{localStorage.setItem('aivacol_user',user);setLogged(true);toast('Bem-vindo, '+user+'! JWT gerado.','ok');};
  const logout=()=>{localStorage.removeItem('aivacol_user');setLogged(false);};
  if(!logged) return <><Login onLogin={login}/><ToastStack toasts={toasts}/></>;
  const pages = {
    dashboard:<Dashboard vehicles={vehicles} models={models} brands={brands}/>,
    vehicles:<VehiclesPage vehicles={vehicles} setVehicles={setVehicles} models={models} brands={brands} toast={toast}/>,
    models:<ModelsPage models={models} setModels={setModels} brands={brands} toast={toast}/>,
    brands:<BrandsPage brands={brands} setBrands={setBrands} models={models} toast={toast}/>,
    users:<UsersPage/>,
    api:<ApiPage/>,
  };
  return <div className="app">
    <Sidebar page={page} setPage={setPage} onLogout={logout}/>
    <div className="main">
      <TopBar page={page}/>
      <div className="content">{pages[page]||pages.dashboard}</div>
    </div>
    <ToastStack toasts={toasts}/>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
